apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: openagentic-v56
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:latest
          imagePullPolicy: IfNotPresent
          args:
            - --query.http-server.host-port=:16687
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - name: query-internal
              containerPort: 16687
            - name: otlp-grpc
              containerPort: 4317
          readinessProbe:
            httpGet:
              path: /
              port: 16687
            initialDelaySeconds: 5
            periodSeconds: 3
        - name: jaeger-ui-proxy
          image: openagentic/jaeger-ui-proxy:v58
          imagePullPolicy: IfNotPresent
          ports:
            - name: query
              containerPort: 16686
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 5
            periodSeconds: 3
          volumeMounts:
            - name: jaeger-ui-proxy-nginx
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: jaeger-ui-proxy-nginx
          configMap:
            name: jaeger-ui-proxy-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query
  namespace: openagentic-v56
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: query
      port: 16686
      targetPort: 16686
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query-internal
  namespace: openagentic-v56
spec:
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: query-internal
      port: 16687
      targetPort: 16687
