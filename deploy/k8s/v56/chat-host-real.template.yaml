apiVersion: apps/v1
kind: Deployment
metadata:
  name: oa-cluster-chat-host
  namespace: openagentic-v56-real
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oa-cluster-chat-host
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oa-cluster-chat-host
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3d-v56-openagentic-server-0
      containers:
        - name: host
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          env:
            - name: PYTHONPATH
              value: /workspace/repo
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: OA_HOST_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
__OA_REMOTE_ENV_BLOCK__
          command:
            - sh
            - -lc
            - >
              python -u -m openagentic_sdk.server.cluster_chat_host
              --host 0.0.0.0
              --port 8766
              --repo-root /workspace/repo
              --session-root /tmp/openagentic-cluster-chat
              --remote-config /workspace/repo/openagentic.remote.json
              --host-node-name-env OA_HOST_NODE_NAME
              --node-url k3d-v56-openagentic-agent-0=http://$OA_REMOTE_WORKER_AGENT_0_SERVICE_HOST:8765
              --node-url k3d-v56-openagentic-agent-1=http://$OA_REMOTE_WORKER_AGENT_1_SERVICE_HOST:8765
          ports:
            - containerPort: 8766
          readinessProbe:
            httpGet:
              path: /health
              port: 8766
            initialDelaySeconds: 2
            periodSeconds: 2
          volumeMounts:
            - name: repo
              mountPath: /workspace/repo
      volumes:
        - name: repo
          hostPath:
            path: /var/lib/openagentic/repo
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: oa-cluster-chat-host
  namespace: openagentic-v56-real
spec:
  selector:
    app.kubernetes.io/name: oa-cluster-chat-host
  ports:
    - name: http
      port: 8766
      targetPort: 8766
