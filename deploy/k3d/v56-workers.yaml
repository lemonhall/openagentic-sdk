apiVersion: v1
kind: Namespace
metadata:
  name: openagentic-v56
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oa-remote-worker-agent-0
  namespace: openagentic-v56
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oa-remote-worker
      oa.openagentic/node-name: k3d-v56-openagentic-agent-0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oa-remote-worker
        oa.openagentic/node-name: k3d-v56-openagentic-agent-0
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3d-v56-openagentic-agent-0
      containers:
        - name: worker
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          env:
            - name: PYTHONPATH
              value: /workspace/repo
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: OA_REMOTE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command:
            - python
            - -u
            - -m
            - openagentic_sdk.subagents.remote_http_worker_server
            - --host
            - 0.0.0.0
            - --port
            - "8765"
            - --repo-root
            - /workspace/repo
            - --session-root
            - /tmp/openagentic-remote
            - --provider-factory
            - e2e_k3d_tests._smoke_provider:create_worker_provider
            - --node-name-env
            - OA_REMOTE_NODE_NAME
          ports:
            - containerPort: 8765
          readinessProbe:
            httpGet:
              path: /health
              port: 8765
            initialDelaySeconds: 2
            periodSeconds: 2
          volumeMounts:
            - name: repo
              mountPath: /workspace/repo
              readOnly: true
      volumes:
        - name: repo
          hostPath:
            path: /var/lib/openagentic/repo
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: oa-remote-worker-agent-0
  namespace: openagentic-v56
spec:
  selector:
    app.kubernetes.io/name: oa-remote-worker
    oa.openagentic/node-name: k3d-v56-openagentic-agent-0
  ports:
    - name: http
      port: 8765
      targetPort: 8765
---
