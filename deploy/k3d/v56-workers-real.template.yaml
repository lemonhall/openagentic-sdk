apiVersion: v1
kind: Namespace
metadata:
  name: openagentic-v56-real
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oa-remote-worker-agent-0
  namespace: openagentic-v56-real
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oa-remote-worker
      oa.openagentic/node-name: k3d-v56-openagentic-agent-0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oa-remote-worker
        oa.openagentic/node-name: k3d-v56-openagentic-agent-0
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3d-v56-openagentic-agent-0
      containers:
        - name: worker
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          env:
            - name: PYTHONPATH
              value: /workspace/repo
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: OTEL_SERVICE_NAME
              value: "oa-remote-worker-real"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.openagentic-v56.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "http://otel-collector.openagentic-v56.svc.cluster.local:4318/v1/traces"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OA_TRACE_ROLE
              value: "worker"
            - name: OA_REMOTE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
__OA_REMOTE_ENV_BLOCK__
          command:
            - sh
            - -lc
            - >
              set -eu;
              python -m pip install -q --no-cache-dir "protobuf<6" "opentelemetry-api<2" "opentelemetry-sdk<2" "opentelemetry-exporter-otlp-proto-http<2";
              export OTEL_RESOURCE_ATTRIBUTES="oa.node.name=${OA_REMOTE_NODE_NAME},oa.role=worker,oa.namespace=openagentic-v56-real";
              exec python -u -m openagentic_sdk.subagents.remote_http_worker_server
              --host 0.0.0.0
              --port 8765
              --repo-root /workspace/repo
              --session-root /tmp/openagentic-remote
              --remote-config /workspace/repo/openagentic.remote.json
              --node-name-env OA_REMOTE_NODE_NAME
          ports:
            - containerPort: 8765
          readinessProbe:
            httpGet:
              path: /health
              port: 8765
            initialDelaySeconds: 2
            periodSeconds: 2
          volumeMounts:
            - name: repo
              mountPath: /workspace/repo
              readOnly: true
      volumes:
        - name: repo
          hostPath:
            path: /var/lib/openagentic/repo
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: oa-remote-worker-agent-0
  namespace: openagentic-v56-real
spec:
  selector:
    app.kubernetes.io/name: oa-remote-worker
    oa.openagentic/node-name: k3d-v56-openagentic-agent-0
  ports:
    - name: http
      port: 8765
      targetPort: 8765
---
