# jaeger-query stays the fixed user-facing entrypoint on :16686.
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-ui-proxy-nginx
  namespace: openagentic-v56
data:
  default.conf: |
    server {
      listen 16686;
      server_name _;

      root /usr/share/nginx/html;
      index index.html;

      location /api/ {
        proxy_pass http://127.0.0.1:16687;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location /analytics {
        proxy_pass http://127.0.0.1:16687;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
      }

      location /serviceedges {
        proxy_pass http://127.0.0.1:16687;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
      }

      location /qualitymetrics-v2 {
        proxy_pass http://127.0.0.1:16687;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
      }

      location /oa/transcript/ {
        proxy_pass http://oa-cluster-chat-host.openagentic-v56-real.svc.cluster.local:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location / {
        try_files $uri $uri/ /index.html;
      }
    }
