name: traceability

on:
  push:
  pull_request:

jobs:
  e2e-trace-check:
    name: e2e trace check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: E2E suite ↔ docs/plan traceability
        run: python scripts/e2e_trace_check.py

