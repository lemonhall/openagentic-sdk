[project]
name = "conpty-expect"
version = "0.0.1"
description = "Windows-first ConPTY spawn/expect (pexpect-like) test harness"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "conpty-expect contributors" }]
keywords = ["conpty", "pty", "pexpect", "expect", "windows", "e2e", "cli", "tui"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: Microsoft :: Windows",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["conpty_expect*"]

[tool.pytest.ini_options]
python_files = ["ce_test_*.py"]
testpaths = ["tests"]
